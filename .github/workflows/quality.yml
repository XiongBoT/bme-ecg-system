name: Project quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'chore/collaboration-quality']
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools -p 'test_*.py' -v
      - run: python tools/check_repository.py
      - run: python tools/check_docs.py
      - run: python tools/sync_docs.py --check
      - name: Verify benchmark report matches its JSON evidence
        run: python '心电云端平台/research/render_benchmark.py' --qrs 'docs/algorithm-validation/qrs-comparison.json' --classification 'docs/algorithm-validation/classification-benchmark.json' --output 'docs/algorithm-validation/算法对比与分类评测.md' --check
      - name: Verify classification diagnostics and error conservation
        working-directory: 心电云端平台
        run: |
          python -m unittest discover -s tests -p test_classification_diagnostics.py -v
          python -m research.classification_diagnostics --check

  python:
    name: Python (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [pi, cloud]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r '树莓派心电终端/requirements-pi.txt' -r '心电云端平台/requirements-test.txt' -r '心电云端平台/requirements-model.txt'
      - name: Provide a virtual screen and Chinese report font
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth fonts-wqy-microhei
      - name: Verify Tk can start
        run: xvfb-run -a python -c "import tkinter as tk; root=tk.Tk(); root.destroy()"
      - name: Run the selected project in its own process
        run: xvfb-run -a python tools/run_checks.py --suite '${{ matrix.suite }}'

  research:
    name: Algorithm evaluation tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r '心电云端平台/requirements-research.txt'
      - name: Check scoring, detector adapters and model replay without external ECG files
        working-directory: 心电云端平台
        run: |
          python - <<'PY'
          import sys, unittest
          import wfdb, neurokit2, ts2vg
          suite = unittest.defaultTestLoader.discover('tests', pattern='*benchmark*.py')
          if not suite.countTestCases():
              raise SystemExit('No algorithm tests discovered')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped:
              raise SystemExit('Algorithm tests failed or were skipped')
          PY

  web:
    name: Web tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: python tools/run_checks.py --suite web

  desktop:
    name: Windows package
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Compile launcher and verify package contents
        working-directory: 心电云端平台
        run: python -m unittest discover -s tests -p test_desktop_package.py -v

  android:
    name: Android package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Test APK assets and manifest
        working-directory: 心电云端平台
        run: python -m unittest discover -s tests -p test_android_package.py -v
      - name: Test URL policy and export integrity
        working-directory: 心电云端平台/android
        run: |
          "$JAVA_HOME_17_X64/bin/javac" -encoding UTF-8 -d "$RUNNER_TEMP/android-tests" src/com/xiongbot/ecgrecords/WebPolicy.java src/com/xiongbot/ecgrecords/ExportCopy.java tests/WebPolicyTest.java tests/ExportCopyTest.java
          "$JAVA_HOME_17_X64/bin/java" -cp "$RUNNER_TEMP/android-tests" com.xiongbot.ecgrecords.WebPolicyTest
          "$JAVA_HOME_17_X64/bin/java" -cp "$RUNNER_TEMP/android-tests" com.xiongbot.ecgrecords.ExportCopyTest
      - name: Test update reminder policy, bounded transport and lifecycle state
        working-directory: 心电云端平台/android
        run: |
          "$JAVA_HOME_17_X64/bin/javac" -encoding UTF-8 -d "$RUNNER_TEMP/android-update-tests" src/com/xiongbot/ecgrecords/WebPolicy.java src/com/xiongbot/ecgrecords/UpdatePolicy.java src/com/xiongbot/ecgrecords/UpdateClient.java src/com/xiongbot/ecgrecords/UpdateCheckState.java tests/UpdatePolicyTest.java tests/UpdateClientTest.java tests/UpdateCheckStateTest.java
          "$JAVA_HOME_17_X64/bin/java" -cp "$RUNNER_TEMP/android-update-tests" com.xiongbot.ecgrecords.UpdatePolicyTest
          "$JAVA_HOME_17_X64/bin/java" -cp "$RUNNER_TEMP/android-update-tests" com.xiongbot.ecgrecords.UpdateClientTest
          "$JAVA_HOME_17_X64/bin/java" -cp "$RUNNER_TEMP/android-update-tests" com.xiongbot.ecgrecords.UpdateCheckStateTest
      - name: Ensure Android build components are installed
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Build and verify APK with an ephemeral CI key
        run: python '心电云端平台/android/build.py' --sdk "$ANDROID_HOME" --jdk "$JAVA_HOME_17_X64" --build-root "$RUNNER_TEMP/android-build"

  gate:
    name: Quality gate
    if: ${{ always() }}
    needs: [source, python, research, web, desktop, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every preceding job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          jobs = json.loads(os.environ['JOB_RESULTS'])
          bad = {name: job['result'] for name, job in jobs.items() if job['result'] != 'success'}
          print('Job results:', {name: job['result'] for name, job in jobs.items()})
          if bad:
              print('Required checks failed, were cancelled, or were skipped:', bad)
              sys.exit(1)
          PY
