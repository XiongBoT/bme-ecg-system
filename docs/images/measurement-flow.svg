<svg xmlns="http://www.w3.org/2000/svg" width="640" height="550" viewBox="0 0 640 550" role="img" aria-labelledby="title desc">
  <title id="title">手机发起测量的交互时序</title>
  <desc id="desc">手机向云端提交固定时长测量请求；树莓派轮询领取，执行采集和本地保存后分块上传。云端校验上传，再按设置或用户操作提交分类和 QRS/RR 分析。客户端查询状态并获得记录和结果。上传完成与分析完成分别判断。</desc>
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #20262d; text-anchor: middle; }
      .name { font-size: 22px; font-weight: 600; }
      .label { font-size: 19px; }
      .box { fill: #fff; stroke: #46515c; stroke-width: 1.5; }
      .life { stroke: #abb2b9; stroke-width: 1; stroke-dasharray: 4 5; }
      .message { fill: none; stroke: #46515c; stroke-width: 1.5; marker-end: url(#arrow); }
      .return { stroke-dasharray: 6 4; }
    </style>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#46515c"/>
    </marker>
  </defs>
  <rect width="640" height="550" fill="#fff"/>
  <rect class="box" x="15" y="20" width="140" height="50"/>
  <text class="name" x="85" y="52">手机 / Web</text>
  <rect class="box" x="250" y="20" width="140" height="50"/>
  <text class="name" x="320" y="52">云端平台</text>
  <rect class="box" x="485" y="20" width="140" height="50"/>
  <text class="name" x="555" y="52">树莓派终端</text>
  <path class="life" d="M 85 70 V 540 M 320 70 V 540 M 555 70 V 540"/>

  <path class="message" d="M 85 125 H 319"/>
  <text class="label" x="202" y="108">提交测量请求</text>
  <path class="message" d="M 555 190 H 321"/>
  <text class="label" x="438" y="173">轮询并领取请求</text>

  <rect class="box" x="549" y="224" width="12" height="78"/>
  <path class="message" d="M 561 237 H 610 V 288 H 562"/>
  <text class="label" x="530" y="258" style="text-anchor:end">采集并保存</text>
  <text class="label" x="530" y="284" style="text-anchor:end">1 / 3 / 5 min</text>

  <path class="message" d="M 555 340 H 321"/>
  <text class="label" x="438" y="323">上传记录 · 完成校验</text>

  <rect class="box" x="314" y="368" width="12" height="58"/>
  <path class="message" d="M 326 378 H 370 V 416 H 327"/>
  <text class="label" x="295" y="391" style="text-anchor:end">提交分析任务¹</text>
  <text class="label" x="295" y="417" style="text-anchor:end">分类 / QRS-RR</text>

  <path class="message" d="M 85 466 H 319"/>
  <text class="label" x="202" y="449">查询状态与结果</text>
  <path class="message return" d="M 320 520 H 86"/>
  <text class="label" x="202" y="503">返回记录与分析状态</text>
</svg>
