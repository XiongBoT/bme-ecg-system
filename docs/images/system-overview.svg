<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">心电采集、云端工作台与心伴授权连接</title>
  <desc id="desc">AD8232 经 STM32 以 360 Hz 采样，七字节串口帧送至树莓派，保存后上传心电云端。工作台查看本人波形、分析和报告。心伴使用独立账号、会话和数据库，经主动绑定读取本人摘要与私密周报，另行授权后提交测量请求。实际采集仍由 STM32 与树莓派完成。实线为数据流，虚线为测量控制方向；终端轮询领取请求。</desc>
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #203444; text-anchor: middle; }
      .title { font-size: 30px; font-weight: 700; }
      .name { font-size: 26px; font-weight: 700; }
      .body { font-size: 23px; }
      .label { font-size: 21px; }
      .note { font-size: 20px; fill: #526776; }
      .box { fill: #fff; stroke: #6c8292; stroke-width: 1.6; rx: 12; }
      .data { fill: none; stroke: #286a85; stroke-width: 2; marker-end: url(#data-arrow); }
      .control { fill: none; stroke: #995c29; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#control-arrow); }
    </style>
    <marker id="data-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#286a85"/></marker>
    <marker id="control-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#995c29"/></marker>
  </defs>
  <rect width="1000" height="1000" fill="#fff"/>
  <text class="title" x="500" y="45">从心电采集到多端访问</text>

  <rect class="box" x="40" y="85" width="300" height="90"/>
  <text class="name" x="190" y="122">AD8232</text>
  <text class="body" x="190" y="156">心电模拟前端</text>
  <rect class="box" x="500" y="85" width="460" height="90"/>
  <text class="name" x="730" y="122">STM32F103C8</text>
  <text class="body" x="730" y="156">ADC · 360 Hz 定时采样</text>
  <path class="data" d="M 340 137 H 498"/>
  <text class="label" x="420" y="121">模拟信号</text>

  <path class="data" d="M 730 175 V 253"/>
  <text class="label" x="710" y="220" style="text-anchor:end">UART · 115200 · 7 B/点</text>
  <rect class="box" x="40" y="255" width="920" height="105" style="fill:#f3f7fa"/>
  <text class="name" x="500" y="296">树莓派终端（多台独立接入）</text>
  <text class="body" x="500" y="334">波形与质量提示 · 端侧分析 · 原始记录保存</text>

  <path class="data" d="M 160 360 V 453"/>
  <text class="label" x="180" y="404" style="text-anchor:start">HTTPS 分块上传</text>
  <path class="control" d="M 460 455 V 362"/>
  <text class="label" x="480" y="431" style="text-anchor:start">终端轮询领取请求</text>

  <rect class="box" x="40" y="455" width="520" height="195" style="fill:#edf6f8;stroke:#286a85"/>
  <text class="name" x="300" y="495">心电云端平台</text>
  <text class="body" x="300" y="536">记录存储 · 分类 · QRS/RR</text>
  <text class="body" x="300" y="575">账号与设备授权 · 任务与复核</text>
  <text class="body" x="300" y="614">记录隔离 · 运行管理 · 备份</text>

  <rect class="box" x="710" y="455" width="250" height="430" style="fill:#f5f7ef;stroke:#66815d"/>
  <text class="name" x="835" y="496">心伴 HeartLife</text>
  <text class="label" x="835" y="531">网页 /heartlife/</text>
  <text class="body" x="835" y="581">日记 · 习惯 · 社区</text>
  <path d="M 734 610 H 936" stroke="#b7c6ae"/>
  <text class="body" x="835" y="650">主动绑定本人账号</text>
  <text class="label" x="835" y="686">心电摘要 · 私密周报</text>
  <text class="label" x="835" y="722">测量须另行授权</text>
  <path d="M 734 753 H 936" stroke="#b7c6ae"/>
  <text class="label" x="835" y="792">独立账号与会话</text>
  <text class="label" x="835" y="828">独立数据库</text>
  <text class="note" x="835" y="864">波形与分析回工作台查看</text>

  <path class="data" d="M 560 520 H 708"/>
  <text class="label" x="635" y="505">本人摘要</text>
  <path class="control" d="M 710 590 H 562"/>
  <text class="label" x="635" y="620">授权测量</text>

  <path class="data" d="M 160 650 V 763"/>
  <text class="label" x="180" y="696" style="text-anchor:start">本人记录与结果</text>
  <path class="control" d="M 460 765 V 652"/>
  <text class="label" x="480" y="732" style="text-anchor:start">提交测量请求</text>
  <rect class="box" x="40" y="765" width="520" height="120"/>
  <text class="name" x="300" y="803">心电工作台</text>
  <text class="body" x="300" y="838">Android · Windows · Web</text>
  <text class="label" x="300" y="869">波形 · 分析 · 趋势 · 报告</text>

  <path class="data" d="M 110 929 H 170"/>
  <text class="label" x="224" y="936">数据流</text>
  <path class="control" d="M 350 929 H 410"/>
  <text class="label" x="490" y="936">测量控制</text>
  <text class="note" x="500" y="978">手机发起请求，STM32 与树莓派实际采集；心伴不直接读取心电数据库。</text>
</svg>
