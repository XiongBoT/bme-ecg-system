<svg xmlns="http://www.w3.org/2000/svg" width="640" height="540" viewBox="0 0 640 540" role="img" aria-labelledby="title desc">
  <title id="title">心电系统结构与接口</title>
  <desc id="desc">AD8232 输出模拟信号，STM32 以 360 Hz 采样，通过七字节串口帧传给树莓派。树莓派本地保存并通过 HTTPS 上传云端。客户端查询本人记录；测量请求由客户端提交云端，终端轮询领取。实线表示数据流，虚线表示测量控制方向。</desc>
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #20262d; text-anchor: middle; }
      .name { font-size: 23px; font-weight: 600; }
      .detail { font-size: 19px; }
      .label { font-size: 18px; }
      .box { fill: #fff; stroke: #46515c; stroke-width: 1.5; }
      .line { fill: none; stroke: #46515c; stroke-width: 1.5; marker-end: url(#arrow); }
      .control { stroke-dasharray: 6 4; }
    </style>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#46515c"/>
    </marker>
  </defs>
  <rect width="640" height="540" fill="#fff"/>

  <rect class="box" x="40" y="20" width="220" height="68"/>
  <text class="name" x="150" y="49">AD8232</text>
  <text class="detail" x="150" y="75">心电模拟前端</text>
  <rect class="box" x="380" y="20" width="220" height="68"/>
  <text class="name" x="490" y="49">STM32F103C8</text>
  <text class="detail" x="490" y="75">ADC · 360 Hz</text>
  <path class="line" d="M 260 60 H 379"/>
  <text class="label" x="320" y="47">模拟信号</text>

  <path class="line" d="M 490 88 V 144"/>
  <text class="label" x="470" y="121" style="text-anchor:end">UART · 115200 · 7 B/点</text>
  <rect class="box" x="40" y="145" width="560" height="68"/>
  <text class="name" x="320" y="174">树莓派终端（可接入多台）</text>
  <text class="detail" x="320" y="200">波形显示 · 质量判断 · 原始记录保存</text>

  <path class="line" d="M 200 213 V 279"/>
  <text class="label" x="180" y="253" style="text-anchor:end">HTTPS 分块上传</text>
  <path class="line control" d="M 440 280 V 214"/>
  <text class="label" x="460" y="253" style="text-anchor:start">轮询领取请求</text>
  <rect class="box" x="40" y="280" width="560" height="84"/>
  <text class="name" x="320" y="311">云端平台</text>
  <text class="detail" x="320" y="341">记录存储 · 分类与 QRS/RR · 管理与备份</text>

  <path class="line" d="M 200 364 V 429"/>
  <text class="label" x="180" y="402" style="text-anchor:end">本人记录与结果</text>
  <path class="line control" d="M 440 430 V 365"/>
  <text class="label" x="460" y="402" style="text-anchor:start">提交测量请求</text>
  <rect class="box" x="40" y="430" width="560" height="68"/>
  <text class="name" x="320" y="459">Android · Windows · Web</text>
  <text class="detail" x="320" y="486">记录查询 · 历史趋势 · 报告查看</text>

  <path class="line" d="M 114 525 H 154"/>
  <text class="label" x="205" y="531">数据流</text>
  <path class="line control" d="M 354 525 H 394"/>
  <text class="label" x="462" y="531">测量控制</text>
</svg>
