# Include inside the EXISTING ECG HTTPS server block; do not add another server.
# Build HeartLife with VITE_BASE_PATH=/heartlife/ and set COOKIE_PATH=/heartlife/.
# Keep the existing / and /api/ ECG locations unchanged.
location = /heartlife {
    return 308 /heartlife/;
}

location ^~ /heartlife/ {
    # Strip only this prefix: /heartlife/api/v1/... -> /api/v1/...
    proxy_pass http://127.0.0.1:8010/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 15s;
    client_max_body_size 2m;
    # Never cache authenticated responses or binding credentials.
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
}
