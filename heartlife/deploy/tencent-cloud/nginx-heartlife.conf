# HeartLife 腾讯云 Nginx HTTPS 反向代理参考配置
# 用法：将 server_name 与 ssl_certificate 路径替换为腾讯云实际域名或 Let's Encrypt IP 证书路径后，
# 放入 /etc/nginx/sites-available/heartlife.conf，执行 sudo nginx -t && sudo systemctl reload nginx。
# 注意：后端仅监听 127.0.0.1:8010，不向公网直接暴露 8010 端口，亦不影响原心电云端平台 (127.0.0.1:8766)。

server {
    listen 80;
    server_name heartlife.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name heartlife.example.com;

    ssl_certificate     /etc/letsencrypt/live/heartlife.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/heartlife.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:HeartLifeSSL:10m;

    client_max_body_size 2m;

    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass         http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
